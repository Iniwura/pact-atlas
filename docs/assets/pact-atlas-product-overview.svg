<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-labelledby="title description">
<title id="title">PACT Atlas — connected community funding</title>
<desc id="description">An editorial illustration of two restricted supporter pledges, one exact allocation, and two connected projects. Project Beta requires Project Alpha. This is a mechanism illustration, not a screenshot or a transaction.</desc>
<defs>
