  <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5B88D"/><stop offset="1" stop-color="#DB8250"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity=".025" stroke-width="1"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="7.8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5AA7F"/></marker>
</defs>
