<text x="78" y="331" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C3C9C0">Funding with conditions, dependencies</text>
<text x="78" y="359" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C3C9C0">and one-use allocation on NEAR.</text>
