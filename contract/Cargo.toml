[package]
name = "pact-atlas-poc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental NEAR-native multi-project conditional funding verifier"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
